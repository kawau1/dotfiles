approval_policy = "on-request"
approvals_reviewer = "auto_review"
model = "gpt-5.6-sol"
model_reasoning_effort = "max"
personality = "pragmatic"
sandbox_mode = "workspace-write"
suppress_unstable_features_warning = true
oss_provider = "ollama"

# プロジェクト履歴、デスクトップUI、通知履歴、端末固有の絶対パスなど、
# Codexが自動生成するローカル状態はこのポータブル設定では管理しない。

[sandbox_workspace_write]
network_access = true

[features]
memories = true
prevent_idle_sleep = true
realtime_conversation = true
runtime_metrics = true

[marketplaces.context7-marketplace]
source_type = "git"
source = "https://github.com/upstash/context7.git"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[plugins."browser@openai-bundled"]
enabled = true

[plugins."build-ios-apps@openai-curated"]
enabled = true

[plugins."build-macos-apps@openai-curated"]
enabled = true

[plugins."build-web-apps@openai-curated"]
enabled = true

[plugins."build-web-data-visualization@openai-curated"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."codex-security@openai-curated"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."context7@context7-marketplace"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."game-studio@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."gmail@openai-curated"]
enabled = true

[plugins."google-calendar@openai-curated"]
enabled = true

[plugins."google-drive@openai-curated"]
enabled = true

[plugins."latex@openai-bundled"]
enabled = true

[plugins."life-science-research@openai-curated"]
enabled = true

[plugins."notion@openai-curated"]
enabled = true

[plugins."openai-developers@openai-curated"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."record-and-replay@openai-bundled"]
enabled = true

[plugins."remotion@openai-curated"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."slack@openai-curated"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."superpowers@openai-curated"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[shell_environment_policy]
inherit = "core"

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "branch-changes", "pull-request-number", "approval-mode", "run-state", "task-progress", "context-used", "five-hour-limit", "weekly-limit", "raw-output"]
status_line_use_colors = true
terminal_title = ["activity", "app-name", "codex-version", "git-branch", "run-state", "task-progress"]
notifications = true
notification_condition = "unfocused"
notification_method = "auto"
pet = "disabled"
